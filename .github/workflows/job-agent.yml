name: Nepal Electrical Jobs Agent

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram connectivity test instead of checking vacancies"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 0 * * *"
    - cron: "15 6 * * *"
    - cron: "15 12 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run vacancy agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          if [ "$TEST_TELEGRAM" = "true" ]; then
            python -m app.main --test-telegram
          else
            python -m app.main
          fi
      - name: Commit state
        run: |
          git config user.name "vacancy-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update vacancy monitoring state"
          git push
